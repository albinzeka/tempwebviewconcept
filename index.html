    const matBackup = new Map(); // uuid -> material(s)
    const calloutsEl = document.getElementById('callouts');
    const legendEl = document.getElementById('legend');

    const HEIGHT_ROOT_CANDIDATES = [
      'cf_n_height', 'Center', 'root', 'Root', 'FR_armature', 'Armature', 'CFB - rig',
    ];

    const REGION_DEFS = [
      { id: 'eyes', label: 'Eyes', color: '#111111' },
      { id: 'head', label: 'Head / face', color: '#e8a0ff' },
      { id: 'neck', label: 'Neck', color: '#ff7a59' },
      { id: 'torso', label: 'Torso / chest', color: '#4dabf7' },
      { id: 'armL', label: 'Arm L', color: '#51cf66' },
      { id: 'armR', label: 'Arm R', color: '#37b24d' },
      { id: 'handL', label: 'Hand L', color: '#94d82d' },
      { id: 'handR', label: 'Hand R', color: '#74b816' },
      { id: 'legL', label: 'Leg L', color: '#fcc419' },
      { id: 'legR', label: 'Leg R', color: '#f59f00' },
      { id: 'footL', label: 'Foot L', color: '#ff922b' },
      { id: 'footR', label: 'Foot R', color: '#f76707' },
      { id: 'other', label: 'Other / unknown', color: '#868e96' },
    ];
    const REGION_BY_ID = Object.fromEntries(REGION_DEFS.map((r) => [r.id, r]));

    /** GLB nodes use DEF-thigh.L; Three/listBones may normalize to DEF-thighL / DEF-thighL001. */
    function boneSide(name) {
      const n = name || '';
      if (/(?:[._])R(?:\.\d+)?$/i.test(n) || /R\d{3}$/i.test(n)) return 'R';
      if (/(?:[._])L(?:\.\d+)?$/i.test(n) || /L\d{3}$/i.test(n)) return 'L';
      if (/(?:thigh|shin|foot|toe|upper_arm|forearm|hand|palm|finger|thumb|breast|pelvis)R(?:\d{3})?$/i.test(n)) return 'R';
      if (/(?:thigh|shin|foot|toe|upper_arm|forearm|hand|palm|finger|thumb|breast|pelvis)L(?:\d{3})?$/i.test(n)) return 'L';
      return '';
    }

    function regionForBoneName(name) {
      const n = name || '';
      if (/eye|lid|lash|shine/i.test(n)) return 'eyes';
      if (/head|face|jaw|chin|lip|mouth|teeth|tongue|nose|brow|cheek|forehead|ear|skull|temple/i.test(n)) return 'head';
      if (/neck|spine\.?005|spine005/i.test(n)) return 'neck';
      const side = boneSide(n);
      if (side && /foot|toe|heel/i.test(n)) return side === 'L' ? 'footL' : 'footR';
      if (side && /thigh|shin|leg|knee/i.test(n)) return side === 'L' ? 'legL' : 'legR';
      if (side && /hand|finger|thumb|palm/i.test(n)) return side === 'L' ? 'handL' : 'handR';
      if (side && /upper_arm|forearm/i.test(n)) return side === 'L' ? 'armL' : 'armR';
      if (/spine|torso|chest|breast|ribs|shoulder|clavicle|pelvis|hips/i.test(n)) return 'torso';
      return 'other';
    }

    function findSkeleton(root) {
      let skel = null;
      root?.traverse((o) => {
        if (!skel && o.isSkinnedMesh && o.skeleton) skel = o.skeleton;
      });
      return skel;
    }

    function normalizeBoneKey(name) {
      return String(name || '').replace(/\./g, '');
    }

    function findObjectByName(root, name) {
      if (!root || !name) return null;
      const exact = root.getObjectByName(name);
      if (exact) return exact;
      // Rigify dotted names vs glTF-stripped names (DEF-thigh.L <-> DEF-thighL)
      const key = normalizeBoneKey(name);
      let found = null;
      root.traverse((o) => {
        if (found || !o.name) return;
        if (normalizeBoneKey(o.name) === key) found = o;
      });
      return found;
    }

    /**
     * Single height pivot: if CTRL-tweak_spine.003 sits under spine_fk.003 for Rigify
     * follow, re-attach it under CTRL-stature (preserve world TRS) and CopyRotation
     * from spine_fk.003 each frame. Dual pivots (stature + chest) crush the mid-
     * torso and make the neck look extruded at short height.
     */
    function bindChestCtrlToStatureForHeight(root) {
      chestFollowSrc = null;
      chestFollowDst = null;
      if (!root) return false;
      const stature = findObjectByName(root, 'CTRL-stature') || findObjectByName(root, 'HEIGHT-stature');
      const chest = findObjectByName(root, 'CTRL-tweak_spine.003') || findObjectByName(root, 'HEIGHT-tweak_spine.003');
      const fk = findObjectByName(root, 'spine_fk.003');
      if (!stature || !chest || !fk) return false;
      if (chest.parent === stature) return false;
      let underFk = false;
      let p = chest.parent;
      let guard = 0;
      while (p && guard++ < 64) {
        if (p === fk || /spine_fk\.?003$/i.test(p.name || '')) {
          underFk = true;
          break;
        }
        p = p.parent;
      }
      if (!underFk) return false;
      stature.attach(chest);
      chestFollowSrc = fk;
      chestFollowDst = chest;
      console.log('[height] rebound', chest.name, 'under', stature.name, '+ CopyRotation from', fk.name);
      return true;
    }

    function applyChestFollowRotation() {
      if (!chestFollowSrc || !chestFollowDst) return;
      chestFollowSrc.getWorldQuaternion(_chestFollowWorldQ);
      if (chestFollowDst.parent) {
        chestFollowDst.parent.getWorldQuaternion(_chestFollowParentQ);
        chestFollowDst.quaternion.copy(_chestFollowParentQ.invert().multiply(_chestFollowWorldQ));
      } else {
        chestFollowDst.quaternion.copy(_chestFollowWorldQ);
      }
    }

    function resolveHeightRoot(root) {
      for (const n of HEIGHT_ROOT_CANDIDATES) {
        const o = findObjectByName(root, n);
        if (o) return o;
      }
      const skel = findSkeleton(root);
      if (skel?.bones?.[0]) {
        let a = skel.bones[0].parent;
        while (a && a.isBone) a = a.parent;
        if (a) return a;
      }
      return root;
    }

    function listBoneNames(root) {
      const names = new Set();
      const skel = findSkeleton(root);
      if (skel) for (const b of skel.bones) if (b.name) names.add(b.name);
      root?.traverse((o) => {
        if (o.name && !o.isMesh && !o.isLight && !o.isCamera) names.add(o.name);
      });
      return [...names].sort();
    }

    function computeBoneMetrics(root) {
      root.updateMatrixWorld(true);
      const skel = findSkeleton(root);
      const box = new THREE.Box3();
      const tmp = new THREE.Vector3();
      let any = false;
      // Bones only — SkinnedMesh setFromObject uses bind pose and hides real height.
      if (skel) {
        for (const b of skel.bones) {
          if (!b.name || /MCH-|ORG-|tweak|ik|fk|widget|handle/i.test(b.name)) {
            // still include DEF and main deformers; skip pure helpers for bbox stability
          }
          if (!b.name) continue;
          // Prefer deform bones for height envelope; fall back to all if needed
          if (!/^DEF-|^spine|^torso|^neck|^head|^thigh|^shin|^foot|^root/i.test(b.name)) continue;
          b.getWorldPosition(tmp);
          box.expandByPoint(tmp);
          any = true;
        }
      }
      if (!any && skel) {
        for (const b of skel.bones) {
          b.getWorldPosition(tmp);
          box.expandByPoint(tmp);
          any = true;
        }
      }
      if (!any || box.isEmpty()) return null;
      const size = new THREE.Vector3();
      box.getSize(size);
      return {
        minY: +box.min.y.toFixed(5),
        maxY: +box.max.y.toFixed(5),
        heightY: +size.y.toFixed(5),
        widthX: +size.x.toFixed(5),
        depthZ: +size.z.toFixed(5),
        ratio: size.x > 1e-6 ? +(size.y / size.x).toFixed(5) : null,
        box: { min: box.min.clone(), max: box.max.clone(), size: size.clone(), center: box.getCenter(new THREE.Vector3()) },
      };
    }

    function computeMeshMetrics(root) {
      // Prefer bone-world AABB so skinned height animation is visible in metrics.
      const m = computeBoneMetrics(root);
      if (!m) return null;
      const { box, ...rest } = m;
      return rest;
    }

    function frameCharacter(root, metricsOverride = null) {
      if (!root) return;
      root.updateMatrixWorld(true);
      findSkeleton(root)?.update();
      const m = metricsOverride || computeBoneMetrics(root);
      if (!m?.box) return;
      const { size, center, min } = {
        size: m.box.size,
        center: m.box.center,
        min: m.box.min,
      };
      const height = Math.max(size.y, 0.5);
      const dist = Math.max(height * 2.55, size.x * 2.3, 3.8);
      const eyeY = min.y + height * 0.52;
      camera.position.set(center.x, eyeY, center.z + dist);
      controls.target.set(center.x, min.y + height * 0.42, center.z);
      camera.lookAt(controls.target);
      camera.updateProjectionMatrix();
    }

    function findFaceAnchor(root) {
      if (!root) return null;
      const prefer = [
        'CTRL-ORG-spine.005', 'CTRL-ORG-spine005',
        'ORG-spine.005', 'ORG-spine005',
        'CTRL-ORG-spine.006', 'head', 'Head', 'DEF-spine.005',
      ];
      let found = null;
      root.traverse((o) => {
        if (found || !o?.name) return;
        const n = String(o.name);
        if (prefer.some((p) => n === p || normalizeBoneKey(n) === normalizeBoneKey(p))) {
          found = o;
        }
      });
      if (!found) {
        root.traverse((o) => {
          if (found || !o?.name) return;
          if (/spine\.?005|head/i.test(o.name) && (o.isBone || o.type === 'Bone' || o.isObject3D)) {
            found = o;
          }
        });
      }
      return found;
    }

    /** Zoom / lock framing on face height (head bone or upper ~18% of body). */
    function frameFace(root, metricsOverride = null) {
      if (!root) return false;
      root.updateMatrixWorld(true);
      findSkeleton(root)?.update();
      const m = metricsOverride || computeBoneMetrics(root);
      if (!m?.box) return false;
      const height = Math.max(m.box.size.y, 0.5);
      const centerX = m.box.center.x;
      const centerZ = m.box.center.z;
      let faceY = m.box.min.y + height * 0.88;
      const head = findFaceAnchor(root);
      if (head) {
        const wp = new THREE.Vector3();
        head.getWorldPosition(wp);
        faceY = wp.y;
      }
      // Closer framing than full-body — roughly head+neck crop
      const dist = Math.max(height * 0.85, m.box.size.x * 1.4, 1.35);
      camera.position.set(centerX, faceY, centerZ + dist);
      controls.target.set(centerX, faceY - height * 0.02, centerZ);
      camera.lookAt(controls.target);
      camera.updateProjectionMatrix();
      return true;
    }

    function applyCameraFraming() {
      if (!glbRoot) return false;
      if (cameraFraming === 'face') return frameFace(glbRoot);
      frameCharacter(glbRoot);
      return true;
    }

    function updateBboxHelper() {
      if (bboxHelper) {
        scene.remove(bboxHelper);
        bboxHelper.geometry?.dispose?.();
        bboxHelper.material?.dispose?.();
        bboxHelper = null;
      }
      if (!showBbox || !glbRoot) return;
      const m = computeBoneMetrics(glbRoot);
      if (!m?.box) return;
      const box = new THREE.Box3(m.box.min, m.box.max);
      bboxHelper = new THREE.Box3Helper(box, 0xffcc00);
      scene.add(bboxHelper);
    }

    function gateLabel() {
      if (!lastMetrics || !baselineMetrics) return '';
      const dY = lastMetrics.heightY - baselineMetrics.heightY;
      const dX = lastMetrics.widthX - baselineMetrics.widthX;
      if (Math.abs(bodyHeight) > 0.05 && Math.abs(dY) < 0.01 && Math.abs(dX) > 0.02) {
        return '<span class="fail">GATE FAIL: width moved, height ~flat</span>';
      }
      if (Math.abs(bodyHeight) > 0.05 && Math.abs(dY) > 0.02) {
        return '<span class="pass">GATE OK: heightY moved</span>';
      }
      return '<span>GATE: idle / baseline</span>';
    }

    function refreshHud() {
      const m = lastMetrics;
      const b = baselineMetrics;
      hudEl.innerHTML = [
        `<div><b>Height sandbox</b> (fixed cam ${controls.enabled ? 'OFF' : 'ON'})</div>`,
        `<div>root: <b>${heightRoot?.name || '—'}</b></div>`,
        `<div>H = <b>${bodyHeight.toFixed(2)}</b> · head = <b>${bodyHeadSize.toFixed(2)}</b> · props ${Object.entries(propValues).map(([k, v]) => `${k[0]}${v.toFixed(1)}`).join(' ')}</div>`,
        m ? `<div>heightY=<b>${m.heightY}</b> widthX=<b>${m.widthX}</b> ratio=<b>${m.ratio}</b></div>` : `<div>metrics: —</div>`,
        b && m ? `<div>ΔY=<b>${(m.heightY - b.heightY).toFixed(4)}</b> ΔX=<b>${(m.widthX - b.widthX).toFixed(4)}</b></div>` : '',
        `<div>${gateLabel()}</div>`,
      ].join('');
    }

    function lerp(a, b, t) { return a + (b - a) * t; }
    function lerpVec(a, b, t) {
      return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), z: lerp(a.z, b.z, t) };
    }

    async function loadHeightRecipe() {
      if (typeof EMBEDDED_HEIGHT_RECIPE !== 'undefined' && EMBEDDED_HEIGHT_RECIPE?.bones?.length) {
        heightRecipe = EMBEDDED_HEIGHT_RECIPE;
        console.log('[height] embedded recipe bones', heightRecipe.bones.length);
      } else {
        try {
          const res = await fetch('./height_recipe_v1.json', { cache: 'no-store' });
          if (!res.ok) throw new Error(String(res.status));
          heightRecipe = await res.json();
          console.log('[height] recipe bones', heightRecipe?.bones?.length);
        } catch (e) {
          console.warn('[height] recipe load failed', e);
          heightRecipe = null;
        }
      }
      if (!heightOverlayMap) {
        try {
          const res = await fetch('./height_overlay_map.json', { cache: 'no-store' });
          if (res.ok) {
            const data = await res.json();
            heightOverlayMap = data.runtime_map || data.mapping || data;
            console.log('[height] overlay map', Object.keys(heightOverlayMap || {}).length);
          }
        } catch (e) {
          console.warn('[height] overlay map load failed', e);
        }
      }
    }

    function resolveOverlayBone(recipeBone) {
      if (!glbRoot || !recipeBone) return null;
      const map = heightOverlayMap || {};
      const candidates = [
        map[recipeBone],
        map[normalizeBoneKey(recipeBone)],
        `CTRL-${recipeBone}`,
        `CTRL-${normalizeBoneKey(recipeBone)}`,
        `HEIGHT-${recipeBone}`,
        `HEIGHT-${normalizeBoneKey(recipeBone)}`,
      ].filter(Boolean);
      for (const c of candidates) {
        const o = findObjectByName(glbRoot, c);
        if (o) return o;
      }
      // Last resort: any CTRL-/HEIGHT-* whose undotted suffix matches recipe bone
      const want = normalizeBoneKey(recipeBone);
      let found = null;
      glbRoot.traverse((o) => {
        if (found || !isCtrlBone(o.name)) return;
        if (normalizeBoneKey(ctrlSuffix(o.name)) === want) found = o;
      });
      return found;
    }

    function captureHeightRestScales(force = false) {
      if (!glbRoot || !heightRecipe?.bones) return;
      if (heightRestScales.size && heightRestTRS.size && !force) return;
      heightRestScales.clear();
      heightRestTRS.clear();
      for (const entry of heightRecipe.bones) {
        const targets = [];
        const direct = findObjectByName(glbRoot, entry.bone);
        if (direct) targets.push({ key: entry.bone, o: direct });
        const overlay = resolveOverlayBone(entry.bone);
        if (overlay) targets.push({ key: `CTRL::${entry.bone}`, o: overlay });
        for (const { key, o } of targets) {
          heightRestScales.set(key, { x: o.scale.x, y: o.scale.y, z: o.scale.z });
          heightRestTRS.set(key, {
            pos: { x: o.position.x, y: o.position.y, z: o.position.z },
            scl: { x: o.scale.x, y: o.scale.y, z: o.scale.z },
            quat: { x: o.quaternion.x, y: o.quaternion.y, z: o.quaternion.z, w: o.quaternion.w },
          });
        }
      }
      if (heightStature?.bone && !heightRestScales.has(heightStature.bone)) {
        const o = findObjectByName(glbRoot, heightStature.bone);
        if (o) {
          heightRestScales.set(heightStature.bone, { x: o.scale.x, y: o.scale.y, z: o.scale.z });
          heightRestTRS.set(heightStature.bone, {
            pos: { x: o.position.x, y: o.position.y, z: o.position.z },
            scl: { x: o.scale.x, y: o.scale.y, z: o.scale.z },
            quat: { x: o.quaternion.x, y: o.quaternion.y, z: o.quaternion.z, w: o.quaternion.w },
          });
        }
      }
    }

    function resetHeightBonesToRest() {
      for (const [name, rest] of heightRestTRS.entries()) {
        const o = findObjectByName(glbRoot, name);
        if (!o) continue;
        o.position.set(rest.pos.x, rest.pos.y, rest.pos.z);
        o.scale.set(rest.scl.x, rest.scl.y, rest.scl.z);
        o.quaternion.set(rest.quat.x, rest.quat.y, rest.quat.z, rest.quat.w);
      }
    }

    function recipeTargetTRS(entry, H) {
      const t = (Math.max(-1, Math.min(1, H)) + 1) / 2;
      const lerpV = (a, b, u) => ({
        x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), z: lerp(a.z, b.z, u),
        ...(a.w != null ? { w: lerp(a.w, b.w, u) } : {}),
      });
      // v4: {scl,pos,quat} or v1: flat {x,y,z} scale only
      const isV4 = !!(entry.short?.scl || entry.mid?.scl);
      if (!isV4) {
        const short = entry.short; const mid = entry.mid; const tall = entry.tall;
        const scl = t <= 0.5 ? lerpV(short, mid, t / 0.5) : lerpV(mid, tall, (t - 0.5) / 0.5);
        return { scl, pos: null, quat: null };
      }
      const pick = (key) => {
        const short = entry.short[key]; const mid = entry.mid[key]; const tall = entry.tall[key];
        if (!short || !mid || !tall) return null;
        return t <= 0.5 ? lerpV(short, mid, t / 0.5) : lerpV(mid, tall, (t - 0.5) / 0.5);
      };
      return { scl: pick('scl'), pos: pick('pos'), quat: pick('quat') };
    }

    function isArmLikeBone(name) {
      return /upper_arm|forearm|hand|finger|thumb|palm|shoulder/i.test(name || '');
    }

    function applyHeightCompose() {
      // Best anim-safe tradeoff: recipe⊗IdleΔ on stature bones; leave arms to mixer (Waving).
      // Idle body motion on torso is still limited — those channels are in the height recipe.
      if (!heightApplyEnabled || heightMode !== 'compose' || !heightRecipe?.bones || !glbRoot) return false;
      if (!heightRestTRS.size) captureHeightRestScales(true);
      for (const entry of heightRecipe.bones) {
        if (isArmLikeBone(entry.bone)) continue;
        const o = findObjectByName(glbRoot, entry.bone);
        const rest = heightRestTRS.get(entry.bone);
        if (!o || !rest) continue;
        o.position.set(rest.pos.x, rest.pos.y, rest.pos.z);
        o.scale.set(rest.scl.x, rest.scl.y, rest.scl.z);
        o.quaternion.set(rest.quat.x, rest.quat.y, rest.quat.z, rest.quat.w);
      }
      if (mixer) mixer.update(0);
      heightMulCache.clear();
      let n = 0;
      for (const entry of heightRecipe.bones) {
        if (isArmLikeBone(entry.bone)) continue;
        const o = findObjectByName(glbRoot, entry.bone);
        if (!o) continue;
        const rest = heightRestTRS.get(entry.bone);
        if (!rest) continue;
        const target = recipeTargetTRS(entry, bodyHeight);
        const animPos = { x: o.position.x, y: o.position.y, z: o.position.z };
        const animScl = { x: o.scale.x, y: o.scale.y, z: o.scale.z };
        const animQuat = o.quaternion.clone();

        if (target.scl && entry.channels?.scl !== false) {
          o.scale.set(
            target.scl.x * (rest.scl.x !== 0 ? animScl.x / rest.scl.x : 1),
            target.scl.y * (rest.scl.y !== 0 ? animScl.y / rest.scl.y : 1),
            target.scl.z * (rest.scl.z !== 0 ? animScl.z / rest.scl.z : 1),
          );
        }
        if (target.pos && entry.channels?.pos !== false) {
          o.position.set(
            target.pos.x + (animPos.x - rest.pos.x),
            target.pos.y + (animPos.y - rest.pos.y),
            target.pos.z + (animPos.z - rest.pos.z),
          );
        }
        if (target.quat && heightRecipe.quatMode !== 'off') {
          const bindQ = new THREE.Quaternion(rest.quat.x, rest.quat.y, rest.quat.z, rest.quat.w);
          const recQ = new THREE.Quaternion(target.quat.x, target.quat.y, target.quat.z, target.quat.w);
          const delta = bindQ.clone().invert().multiply(animQuat);
          o.quaternion.copy(recQ).multiply(delta);
        }
        heightMulCache.set(entry.bone, { x: o.scale.x, y: o.scale.y, z: o.scale.z });
        n++;
      }
      glbRoot.updateMatrixWorld(true);
      findSkeleton(glbRoot)?.update();
      return n > 0;
    }

    function applyHeightMul() {
      // Anim-safe: re-sample mixer pose (absolute), then multiply stature factors once.
      // At H=mid factors are 1 / deltas 0 → animation unchanged.
      if (!heightApplyEnabled || heightMode !== 'mul' || !heightRecipe?.bones || !glbRoot) return false;
      if (mixer) mixer.update(0);
      heightMulCache.clear();
      let n = 0;
      for (const entry of heightRecipe.bones) {
        const o = findObjectByName(glbRoot, entry.bone);
        if (!o) continue;
        const target = recipeTargetTRS(entry, bodyHeight);
        const midScl = entry.mid?.scl || entry.mid || { x: 1, y: 1, z: 1 };
        const midPos = entry.mid?.pos;
        if (target.scl && entry.channels?.scl !== false) {
          o.scale.set(
            o.scale.x * (midScl.x !== 0 ? target.scl.x / midScl.x : 1),
            o.scale.y * (midScl.y !== 0 ? target.scl.y / midScl.y : 1),
            o.scale.z * (midScl.z !== 0 ? target.scl.z / midScl.z : 1),
          );
        }
        if (target.pos && entry.channels?.pos !== false && midPos) {
          o.position.x += (target.pos.x - midPos.x);
          o.position.y += (target.pos.y - midPos.y);
          o.position.z += (target.pos.z - midPos.z);
        }
        heightMulCache.set(entry.bone, { x: o.scale.x, y: o.scale.y, z: o.scale.z });
        n++;
      }
      glbRoot.updateMatrixWorld(true);
      findSkeleton(glbRoot)?.update();
      return n > 0;
    }

    function applyHeightOverlay() {
      // Drive CTRL-* parents of Rigify tweak/ORG sources (not DEF — DEF uses world Copy Transforms).
      // Children keep Idle/Waving; height is inherited through constraint sources.
      if (!heightApplyEnabled || heightMode !== 'overlay' || !heightRecipe?.bones || !glbRoot) return false;
      if (!heightRestTRS.size) captureHeightRestScales(true);
      heightMulCache.clear();
      const trsMode = heightOverlayTrs || 'scl'; // 'scl' | 'sclpos' | 'trs'
      let n = 0;
      for (const entry of heightRecipe.bones) {
        const o = resolveOverlayBone(entry.bone);
        if (!o || !isCtrlBone(o.name)) continue;
        const target = recipeTargetTRS(entry, bodyHeight);
        if (!target.scl && trsMode === 'scl') continue;

        if (target.scl && entry.channels?.scl !== false) {
          // Absolute recipe scales on CTRL parents (rest ~identity; sources aren't Height-keyed).
          o.scale.set(target.scl.x, target.scl.y, target.scl.z);
        }
        if ((trsMode === 'sclpos' || trsMode === 'trs') && target.pos && entry.channels?.pos !== false) {
          const midPos = entry.mid?.pos;
          const restKey = `CTRL::${entry.bone}`;
          const rest = heightRestTRS.get(restKey) || heightRestTRS.get(`HEIGHT::${entry.bone}`) || heightRestTRS.get(o.name);
          if (midPos && rest?.pos) {
            o.position.set(
              rest.pos.x + (target.pos.x - midPos.x),
              rest.pos.y + (target.pos.y - midPos.y),
              rest.pos.z + (target.pos.z - midPos.z),
            );
          } else if (trsMode === 'trs' && target.pos) {
            o.position.set(target.pos.x, target.pos.y, target.pos.z);
          }
        }
        if (trsMode === 'trs' && target.quat && heightRecipe.quatMode !== 'off') {
          if (!/upper_arm|forearm|hand|finger|thumb|palm|shoulder/i.test(entry.bone)) {
            o.quaternion.set(target.quat.x, target.quat.y, target.quat.z, target.quat.w);
          }
        }
        heightMulCache.set(o.name, { x: o.scale.x, y: o.scale.y, z: o.scale.z, recipe: entry.bone });
        n++;
      }
      glbRoot.updateMatrixWorld(true);
      findSkeleton(glbRoot)?.update();
      return n > 0;
    }

    function applyHeightRecipe() {
      if (!heightApplyEnabled || heightMode !== 'recipe' || !heightRecipe?.bones || !glbRoot) return false;
      if (!heightRestTRS.size) captureHeightRestScales(true);
      heightMulCache.clear();
      let n = 0;
      for (const entry of heightRecipe.bones) {
        const o = findObjectByName(glbRoot, entry.bone);
        if (!o) continue;
        const target = recipeTargetTRS(entry, bodyHeight);
        const rest = heightRestTRS.get(entry.bone);
        const midScl = entry.mid?.scl || entry.mid || { x: 1, y: 1, z: 1 };
        const midPos = entry.mid?.pos;
        const midQuat = entry.mid?.quat;

        if (target.scl) {
          if (rest?.scl) {
            o.scale.set(
              rest.scl.x * (midScl.x !== 0 ? target.scl.x / midScl.x : 1),
              rest.scl.y * (midScl.y !== 0 ? target.scl.y / midScl.y : 1),
              rest.scl.z * (midScl.z !== 0 ? target.scl.z / midScl.z : 1),
            );
          } else {
            o.scale.set(target.scl.x, target.scl.y, target.scl.z);
          }
        }
        if (target.pos && (entry.channels?.pos !== false)) {
          // Prefer absolute local position from recipe (matches teacher frames).
          // Relative mode: rest.pos + (target - mid) when recipe.posMode === 'relative'.
          if (heightRecipe.posMode === 'relative' && rest?.pos && midPos) {
            o.position.set(
              rest.pos.x + (target.pos.x - midPos.x),
              rest.pos.y + (target.pos.y - midPos.y),
              rest.pos.z + (target.pos.z - midPos.z),
            );
          } else {
            o.position.set(target.pos.x, target.pos.y, target.pos.z);
          }
        }
        if (target.quat && heightRecipe.quatMode !== 'off') {
          // Keep arm/hand waveable: do not overwrite extremity rotations.
          if (!/upper_arm|forearm|hand|finger|thumb|palm|shoulder/i.test(entry.bone)) {
            o.quaternion.set(target.quat.x, target.quat.y, target.quat.z, target.quat.w);
          }
        }
        heightMulCache.set(entry.bone, { x: o.scale.x, y: o.scale.y, z: o.scale.z });
        n++;
      }
      if (heightStature?.bone) {
        const o = findObjectByName(glbRoot, heightStature.bone);
        if (o) {
          const t = (Math.max(-1, Math.min(1, bodyHeight)) + 1) / 2;
          let s;
          if (t <= 0.5) s = lerp(heightStature.short ?? 1, heightStature.mid ?? 1, t / 0.5);
          else s = lerp(heightStature.mid ?? 1, heightStature.tall ?? 1, (t - 0.5) / 0.5);
          const axis = heightStature.axis || 'z';
          const rest = heightRestScales.get(heightStature.bone) || { x: 1, y: 1, z: 1 };
          const fromRecipe = heightMulCache.get(heightStature.bone);
          const base = fromRecipe || rest;
          o.scale.set(
            base.x * (axis === 'xyz' || axis.indexOf('x') >= 0 ? s : 1),
            base.y * (axis === 'xyz' || axis.indexOf('y') >= 0 ? s : 1),
            base.z * (axis === 'xyz' || axis.indexOf('z') >= 0 ? s : 1),
          );
        }
      }
      glbRoot.updateMatrixWorld(true);
      findSkeleton(glbRoot)?.update();
      return n > 0;
    }

    /** Scalar stature (ground offset + legacy neck compensate). */
    function statureMul() {
      return 1 + 0.2 * bodyHeight;
    }

    /** Natural height: torso length (local Y). */
    function statureSyTorso() {
      return 1 + 0.12 * bodyHeight;
    }

    /** Natural height: weak width on stature (local X/Z). */
    function statureSxz() {
      return 1 + 0.04 * bodyHeight;
    }

    /** Natural height: leg length (thigh/shin tweak Y). */
    function statureSyLeg() {
      return 1 + 0.322 * bodyHeight;
    }

    function headSizeMul() {
      // Bind rest looks small; former slider max (×1.2) is the visual base at head=0.
      return HEAD_BASE * (1 + 0.2 * bodyHeadSize);
    }

    /** Isotropic length + optional throat width damp (only when headSize > 0). */
    function headSizeScaleAxes() {
      const mul = headSizeMul();
      if (bodyHeadSize <= 0) return { x: mul, y: mul, z: mul };
      // Above 0: X/Z take 70% of growth above base (throat less thick).
      const widthMul = HEAD_BASE + (mul - HEAD_BASE) * 0.7;
      return { x: widthMul, y: mul, z: widthMul };
    }

    /** World neck target ≈ (1 + NECK_WEIGHT*(S-1)) * headNeck share. */
    function neckWorldAxis(statureS, headAxis) {
      const fromStature = 1 + NECK_WEIGHT * (statureS - 1);
      const fromHead = 1 + NECK_WEIGHT * (headAxis / HEAD_BASE - 1);
      return fromStature * fromHead;
    }

    /** Local .004 when parent already has stature scale S (legacy under CTRL-stature). */
    function neckLocalAxis(statureS, headAxis) {
      return neckWorldAxis(statureS, headAxis) / statureS;
    }

    function propRangeMul(value, range) {
      const v = Math.max(-1, Math.min(1, +value || 0));
      // small: 0.9..1.1  |  big: 0.8..1.2
      const amp = range === 'big' ? 0.2 : 0.1;
      return 1 + amp * v;
    }

    /** Accumulate per-bone local axis multipliers from propValues. */
    function collectPropAxisMuls() {
      const out = new Map(); // undotName -> {x,y,z}
      const ensure = (key) => {
        if (!out.has(key)) out.set(key, { x: 1, y: 1, z: 1 });
        return out.get(key);
      };
      for (const def of Object.values(PROP_DEFS)) {
        const mul = propRangeMul(propValues[def.id], def.range);
        if (Math.abs(mul - 1) < 1e-9) continue;
        for (const t of def.targets) {
          const key = normalizeBoneKey(t.bone);
          const axes = String(t.axes || 'xyz').toLowerCase();
          const slot = ensure(key);
          if (axes.includes('x')) slot.x *= mul;
          if (axes.includes('y')) slot.y *= mul;
          if (axes.includes('z')) slot.z *= mul;
        }
      }
      return out;
    }

    function propMulForEntry(entryName, propMuls) {
      if (!propMuls?.size) return { x: 1, y: 1, z: 1 };
      const undot = normalizeBoneKey(entryName);
      for (const [k, v] of propMuls) {
        if (k === undot || normalizeBoneKey(k) === undot) return v;
      }
      // Also match CTRL-DEF-upper_armL vs CTRL-DEF-upper_arm.L
      return propMuls.get(undot) || { x: 1, y: 1, z: 1 };
    }

    function applyCtrlScales(entries) {
      const S = statureMul();
      const syTorso = statureSyTorso();
      const sxz = statureSxz();
      const syLeg = statureSyLeg();
      const headAxes = headSizeScaleAxes();
      const hasStature = entries.some((e) => isStatureCtrl(e.name));
      // Neck locals when parent is CTRL-stature (per-axis stature, not isotropic S).
      const neckUnderStature = {
        x: neckLocalAxis(sxz, headAxes.x),
        y: neckLocalAxis(syTorso, headAxes.y),
        z: neckLocalAxis(sxz, headAxes.z),
      };
      // Cancel inherited stature so world head ≈ headAxes (not squished/tall with height).
      const headCancelStature = {
        x: headAxes.x / sxz,
        y: headAxes.y / syTorso,
        z: headAxes.z / sxz,
      };
      const headLocalUnderStature = {
        x: headAxes.x / (sxz * neckUnderStature.x),
        y: headAxes.y / (syTorso * neckUnderStature.y),
        z: headAxes.z / (sxz * neckUnderStature.z),
      };
      const propMuls = collectPropAxisMuls();
      for (const entry of entries) {
        const o = entry.object;
        if (!o) continue;
        const p = propMulForEntry(entry.name, propMuls);
        const carrier = statureCarrierAncestor(o);
        let lx = 1;
        let ly = 1;
        let lz = 1;
        if (hasStature) {
          if (isStatureCtrl(entry.name)) {
            lx = sxz;
            ly = syTorso;
            lz = sxz;
          } else if (isLegLengthCtrl(entry.name)) {
            ly = syLeg;
          } else if (isChestHeightCtrl(entry.name) && !carrier) {
            // Legacy: under spine_fk.003 — drive chest stature here.
            lx = sxz;
            ly = syTorso;
            lz = sxz;
          } else if (isHeadNeckCtrl(entry.name)) {
            if (carrier === 'stature') {
              // Legacy: child of CTRL-stature → compensated local.
              lx = neckUnderStature.x;
              ly = neckUnderStature.y;
              lz = neckUnderStature.z;
            } else if (carrier === 'chest') {
              // Child of CTRL-tweak_spine.003 (inherits stature): no extra scale.
              lx = ly = lz = 1;
            } else {
              lx = sxz;
              ly = syTorso;
              lz = sxz;
            }
          } else if (isHeadSizeCtrl(entry.name)) {
            if (carrier === 'stature') {
              lx = headLocalUnderStature.x;
              ly = headLocalUnderStature.y;
              lz = headLocalUnderStature.z;
            } else if (carrier === 'chest') {
              // Inherit stature via chest — undo XZ/Y so head size stays constant with H.
              lx = headCancelStature.x;
              ly = headCancelStature.y;
              lz = headCancelStature.z;
            } else {
              lx = headAxes.x;
              ly = headAxes.y;
              lz = headAxes.z;
            }
          } else {
            // .006 + proportion CTRLs: bind local, then props; inherit via parent.
            lx = ly = lz = 1;
          }
        } else if (isMutedHeadOrgCtrl(entry.name)) {
          lx = ly = lz = 1;
        } else {
          lx = ly = lz = S;
        }
        o.scale.set(
          entry.rest.x * lx * p.x,
          entry.rest.y * ly * p.y,
          entry.rest.z * lz * p.z,
        );
      }
    }

    function collectHeightParentBones(root) {
      const out = [];
      heightRootOverlay = null;
      heightRootRestPos = null;
      if (!root) return out;
      root.traverse((o) => {
        if (!isCtrlBone(o?.name)) return;
        if (isCtrlRootBone(o.name)) {
          heightRootOverlay = o;
          heightRootRestPos = { x: o.position.x, y: o.position.y, z: o.position.z };
          return;
        }
        out.push({
          name: o.name,
          object: o,
          rest: { x: o.scale.x, y: o.scale.y, z: o.scale.z },
        });
      });
      // Prefer user-verified stature drivers first for HUD/root display.
      const prefer = [
        'CTRL-stature', 'HEIGHT-stature',
        'CTRL-tweak_spine', 'HEIGHT-tweak_spine',
        'CTRL-tweak_spine.003', 'HEIGHT-tweak_spine.003',
        'CTRL-ORG-spine.004', 'HEIGHT-ORG-spine.004',
        'CTRL-ORG-spine.005', 'HEIGHT-ORG-spine.005',
        'CTRL-ORG-spine.006', 'HEIGHT-ORG-spine.006',
      ];
      out.sort((a, b) => {
        const ia = prefer.indexOf(a.name);
        const ib = prefer.indexOf(b.name);
        if (ia >= 0 || ib >= 0) return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib);
        return a.name.localeCompare(b.name);
      });
      return out;
    }

    function captureFormCtrlRests(root) {
      formCtrlRest.clear();
      formCtrlObjects.clear();
      if (!root) return 0;
      const bones = new Set(Object.values(FORM_CTRL_DEFS).map((d) => d.bone));
      let n = 0;
      for (const boneName of bones) {
        const o = findObjectByName(root, boneName);
        if (!o) continue;
        const key = normalizeBoneKey(boneName);
        formCtrlObjects.set(key, o);
        formCtrlRest.set(key, {
          pos: { x: o.position.x, y: o.position.y, z: o.position.z },
          scl: { x: o.scale.x, y: o.scale.y, z: o.scale.z },
        });
        n += 1;
      }
      return n;
    }

    function applyFormCtrls() {
      if (!glbRoot || !formCtrlRest.size) return false;
      // Gather per-bone desired deltas from all form sliders.
      const byBone = new Map(); // key -> { pos:{x,y,z}, scl:{x,y,z} } multipliers/offsets
      for (const def of Object.values(FORM_CTRL_DEFS)) {
        const key = normalizeBoneKey(def.bone);
        if (!byBone.has(key)) {
          byBone.set(key, {
            dPos: { x: 0, y: 0, z: 0 },
            dScl: { x: 1, y: 1, z: 1 },
          });
        }
        const slot = byBone.get(key);
        const v = Math.max(-1, Math.min(1, +formCtrlValues[def.id] || 0));
        const axis = String(def.axis || 'x').toLowerCase();
        const amp = +def.amp || 0;
        if (def.mode === 'pos') {
          slot.dPos[axis] += v * amp;
        } else if (def.mode === 'scl') {
          slot.dScl[axis] *= (1 + v * amp);
        }
      }
      for (const [key, delta] of byBone) {
        const o = formCtrlObjects.get(key);
        const rest = formCtrlRest.get(key);
        if (!o || !rest) continue;
        o.position.set(
          rest.pos.x + delta.dPos.x,
          rest.pos.y + delta.dPos.y,
          rest.pos.z + delta.dPos.z,
        );
        // Scale: compose with whatever applyCtrlScales already wrote this frame.
        // Prefer rest * form so we don't fight height parents on this bone.
        o.scale.set(
          rest.scl.x * delta.dScl.x,
          rest.scl.y * delta.dScl.y,
          rest.scl.z * delta.dScl.z,
        );
      }
      return true;
    }

    function computeFootGroundY() {
      if (!glbRoot) return 0;
      glbRoot.updateMatrixWorld(true);
      const footNames = [
        'DEF-footL', 'DEF-footR', 'DEF-foot.L', 'DEF-foot.R',
        'DEF-toeL', 'DEF-toeR', 'DEF-toe.L', 'DEF-toe.R',
      ];
      const tmp = new THREE.Vector3();
      let minY = Infinity;
      for (const name of footNames) {
        const o = findObjectByName(glbRoot, name);
        if (!o) continue;
        o.getWorldPosition(tmp);
        if (tmp.y < minY) minY = tmp.y;
      }
      return Number.isFinite(minY) ? minY : 0;
    }

    function applySceneGroundOffset(mul) {
      if (!glbRoot) return;
      let offset = 0;
      if (mul >= 1) offset = heightGroundLiftPerMul * (mul - 1);
      else offset = -heightGroundSinkPerMul * (1 - mul);
      glbRoot.position.y = heightSceneRestY + offset;
    }

    function calibrateHeightGroundOffset() {
      heightGroundLiftPerMul = 0;
      heightGroundSinkPerMul = 0;
      if (!heightParentBones.length || !glbRoot) return;
      const savedH = bodyHeight;

      const applyScales = (h) => {
        const saved = bodyHeight;
        bodyHeight = h;
        applyCtrlScales(heightParentBones);
        bodyHeight = saved;
      };
      const resetRootOverlay = () => {
        if (heightRootOverlay && heightRootRestPos) {
          heightRootOverlay.position.set(heightRootRestPos.x, heightRootRestPos.y, heightRootRestPos.z);
        }
      };

      bodyHeight = 0;
      applyScales(0);
      resetRootOverlay();
      applySceneGroundOffset(1);
      glbRoot.updateMatrixWorld(true);
      findSkeleton(glbRoot)?.update();
      const footAt0 = computeFootGroundY();

      applyScales(1);
      resetRootOverlay();
      glbRoot.position.y = heightSceneRestY;
      glbRoot.updateMatrixWorld(true);
      findSkeleton(glbRoot)?.update();
      const footAtPlus = computeFootGroundY();
      const drop = footAt0 - footAtPlus;
      // Ground lift is keyed to body mul delta (weight 1 bones use 0.2).
      heightGroundLiftPerMul = drop > 1e-5 ? drop / 0.2 : 0;

      applyScales(-1);
      resetRootOverlay();
      glbRoot.position.y = heightSceneRestY;
      glbRoot.updateMatrixWorld(true);
      findSkeleton(glbRoot)?.update();
      const footAtMinus = computeFootGroundY();
      const rise = footAtMinus - footAt0;
      heightGroundSinkPerMul = rise > 1e-5 ? rise / 0.2 : 0;

      bodyHeight = savedH;
    }

    function applyHeightParents() {
      if (!heightApplyEnabled || heightMode !== 'parents' || !heightParentBones.length) return false;
      applyCtrlScales(heightParentBones);
      applyChestFollowRotation();
      // Ground offset follows full body stature mul (weight-1 reference).
      applySceneGroundOffset(1 + 0.2 * bodyHeight);
      glbRoot?.updateMatrixWorld(true);
      findSkeleton(glbRoot)?.update();
      return true;
    }

    function applyHeight() {
      let ok = false;
      if (!heightApplyEnabled || heightMode === 'off') {
        ok = false;
      } else if (heightMode === 'recipe') {
        applyHeightRecipe();
        ok = true;
      } else if (heightMode === 'compose') {
        applyHeightCompose();
        ok = true;
      } else if (heightMode === 'mul') {
        applyHeightMul();
        ok = true;
      } else if (heightMode === 'overlay') {
        applyHeightOverlay();
        ok = true;
      } else if (heightMode === 'parents') {
        applyHeightParents();
        ok = true;
      } else if (heightRoot) {
        // legacy single-root uniform scale
        const mul = 1 + 0.2 * bodyHeight;
        const s = heightRootBaseline * mul;
        heightRoot.scale.set(s, s, s);
        heightRoot.updateMatrix();
        glbRoot?.updateMatrixWorld(true);
        findSkeleton(glbRoot)?.update();
        ok = true;
      }
      lastMetrics = glbRoot ? computeMeshMetrics(glbRoot) : null;
      if (showBbox) updateBboxHelper();
      // Keep face crop locked while scrubbing height / head size
      if (cameraFraming === 'face') frameFace(glbRoot);
      refreshHud();
      return ok;
    }

    function dumpLandmarks() {
      const names = [
        'DEF-spine006', 'DEF-spine005', 'DEF-spine004', 'DEF-spine003', 'DEF-spine002', 'DEF-spine001', 'DEF-spine',
        'DEF-thighL', 'DEF-shinL', 'DEF-footL', 'DEF-thighR', 'DEF-shinR', 'DEF-footR',
        'DEF-upper_armL', 'DEF-handL', 'head', 'neck', 'torso',
      ];
      const tmp = new THREE.Vector3();
      const pts = {};
      for (const n of names) {
        const o = findObjectByName(glbRoot, n);
        if (!o) continue;
        o.getWorldPosition(tmp);
        pts[n] = { x: +tmp.x.toFixed(5), y: +tmp.y.toFixed(5), z: +tmp.z.toFixed(5) };
      }
      const m = computeMeshMetrics(glbRoot);
      const h = m?.heightY || 1;
      const minY = m?.minY || 0;
      const ratios = {};
      for (const [n, p] of Object.entries(pts)) {
        ratios[n] = +((p.y - minY) / h).toFixed(5);
      }
      return { metrics: m, points: pts, ratios, H: bodyHeight, mode: heightMode };
    }

    function disposeMixer() {
      if (mixer) {
        mixer.stopAllAction();
        mixer.uncacheRoot?.(glbRoot);
      }
      mixer = null;
      animClips = [];
      animActions = [];
      animPlaying = false;
    }

    function setupAnimations(gltf) {
      disposeMixer();
      animClips = gltf.animations || [];
      if (!animClips.length || !gltf.scene) return;
      mixer = new THREE.AnimationMixer(gltf.scene);
      animActions = animClips.map((clip) => {
        const action = mixer.clipAction(clip);
        action.enabled = true;
        action.setLoop(THREE.LoopRepeat, Infinity);
        action.clampWhenFinished = false;
        action.play();
        action.paused = true;
        action.time = 0;
        return action;
      });
      mixer.update(0);
    }

    function refreshAfterPose() {
      glbRoot?.updateMatrixWorld(true);
      findSkeleton(glbRoot)?.update();
      lastMetrics = computeMeshMetrics(glbRoot);
      if (showBbox) updateBboxHelper();
      refreshHud();
    }

    function animList() {
      return animClips.map((c, i) => ({
        index: i,
        name: c.name || `clip_${i}`,
        duration: c.duration,
        frames: +(c.duration * animFps).toFixed(3),
      }));
    }

    function animSeek({ clip = 0, time = null, frame = null, fps = null } = {}) {
      if (fps) animFps = +fps;
      const action = animActions[clip];
      const c = animClips[clip];
      if (!action || !c || !mixer) return null;
      let t = time;
      if (frame != null) t = (+frame) / animFps;
      if (t == null) t = 0;
      t = Math.max(0, Math.min(c.duration, +t));
      animPlaying = false;
      for (const a of animActions) {
        a.paused = true;
        a.enabled = false;
      }
      action.enabled = true;
      action.paused = true;
      action.time = t;
      action.play();
      mixer.update(0);
      refreshAfterPose();
      return {
        name: c.name || `clip_${clip}`,
        time: t,
        frame: +(t * animFps).toFixed(3),
        duration: c.duration,
        endFrame: +(c.duration * animFps).toFixed(3),
        metrics: lastMetrics,
      };
    }

    function backupMaterials() {
      if (!glbRoot || matBackup.size) return;
      glbRoot.traverse((o) => {
        if (!o.isMesh) return;
        matBackup.set(o.uuid, Array.isArray(o.material) ? o.material.slice() : o.material);
      });
    }

    function restoreMaterials() {
      if (!glbRoot) return;
      glbRoot.traverse((o) => {
        if (!o.isMesh) return;
        const m = matBackup.get(o.uuid);
        if (m) o.material = m;
        if (o.geometry?.getAttribute('color')) {
          o.geometry.deleteAttribute('color');
        }
      });
      mapMode = null;
      clearCallouts();
      legendEl.classList.remove('visible');
      legendEl.innerHTML = '';
    }

    function setOutlineVisible(on) {
      glbRoot?.traverse((o) => {
        if (!o.isMesh) return;
        if (/outline|cycleoutline/i.test(o.name) || /outline/i.test(o.parent?.name || '')) {
          o.visible = !!on;
        }
      });
    }

    function setClarityMode(on) {
      clarityOn = !!on;
      document.body.classList.toggle('clarity', clarityOn);
      if (clarityOn) {
        scene.background = new THREE.Color(0xe8ecf1);
        wall.material.map = makeChecker(512, 16, '#d0d5dd', '#c2c8d2');
        wall.material.needsUpdate = true;
        gridFloor.visible = true;
        key.intensity = 1.35;
        fill.intensity = 0.55;
        rim.intensity = 0.7;
        setOutlineVisible(false);
        showBbox = false;
        updateBboxHelper();
        // slight clay shading if not in map mode
        if (!mapMode) {
          backupMaterials();
          glbRoot?.traverse((o) => {
            if (!o.isMesh || !o.visible) return;
            o.material = new THREE.MeshStandardMaterial({
              color: /eye/i.test(o.name) ? 0x1a1a1a : 0xc9c9c9,
              roughness: 0.72,
              metalness: 0.02,
              flatShading: false,
            });
          });
        }
      } else {
        scene.background = new THREE.Color(0x2a2a2a);
        wall.material.map = makeChecker();
        wall.material.needsUpdate = true;
        key.intensity = 1.1;
        fill.intensity = 0.35;
        rim.intensity = 0.45;
        setOutlineVisible(true);
        if (!mapMode) restoreMaterials();
      }
      refreshHud();
      return true;
    }

    function meshRegionGuess(meshName) {
      const n = meshName || '';
      if (/eye/i.test(n)) return 'eyes';
      if (/head/i.test(n)) return 'head';
      if (/body/i.test(n)) return 'torso';
      return 'other';
    }

    function colorByMeshParts() {
      if (!glbRoot) return null;
      backupMaterials();
      restoreMaterials();
      backupMaterials();
      mapMode = 'mesh';
      const counts = {};
      const MESH_COLORS = {
        'Body.001': '#4dabf7',
        'Head.001': '#e8a0ff',
        'Eyes.001': '#111111',
        'Fake Eye Shine.001': '#ffffff',
        'Cycles Outline.001': '#868e96',
        FR_body: '#4dabf7',
        FR_head: '#e8a0ff',
        FR_eyes: '#111111',
        FR_eyeshine: '#ffffff',
        FR_cycleoutline: '#868e96',
      };
      glbRoot.traverse((o) => {
        if (!o.isMesh) return;
        const keyName = o.name || o.parent?.name || 'unknown';
        const hex = MESH_COLORS[keyName] || MESH_COLORS[o.parent?.name] || '#868e96';
        counts[keyName] = (counts[keyName] || 0) + 1;
        o.material = new THREE.MeshStandardMaterial({
          color: new THREE.Color(hex),
          roughness: 0.65,
          metalness: 0.02,
        });
        o.visible = !/outline/i.test(keyName);
      });
      const legend = Object.keys(counts).map((name) => ({
        name,
        color: MESH_COLORS[name] || '#868e96',
        guess: REGION_BY_ID[meshRegionGuess(name)]?.label || name,
      }));
      showLegend(legend.map((e) => ({ id: e.name, label: `${e.name} → ${e.guess}`, color: e.color })));
      return { mode: 'mesh', legend };
    }

    function colorByBoneRegions() {
      if (!glbRoot) return null;
      backupMaterials();
      restoreMaterials();
      backupMaterials();
      mapMode = 'region';
      setOutlineVisible(false);
      const skel = findSkeleton(glbRoot);
      const counts = Object.fromEntries(REGION_DEFS.map((r) => [r.id, 0]));
      const anchors = {}; // region -> world position sum/count

      glbRoot.traverse((o) => {
        if (!o.isSkinnedMesh || !o.skeleton) return;
        const geo = o.geometry;
        const pos = geo.getAttribute('position');
        const skinIndex = geo.getAttribute('skinIndex');
        const skinWeight = geo.getAttribute('skinWeight');
        if (!pos || !skinIndex || !skinWeight) {
          const rid = meshRegionGuess(o.name);
          counts[rid] += pos?.count || 1;
          o.material = new THREE.MeshStandardMaterial({
            color: new THREE.Color(REGION_BY_ID[rid].color),
            roughness: 0.65,
            metalness: 0.02,
          });
          return;
        }
        const colors = new Float32Array(pos.count * 3);
        const bones = o.skeleton.bones;
        const tmp = new THREE.Color();
        for (let i = 0; i < pos.count; i++) {
          let bestW = -1;
          let bestBone = null;
          for (let k = 0; k < 4; k++) {
            const w = skinWeight.getComponent(i, k);
            if (w > bestW) {
              bestW = w;
              bestBone = bones[skinIndex.getComponent(i, k)];
            }
          }
          const rid = regionForBoneName(bestBone?.name || '');
          counts[rid]++;
          tmp.set(REGION_BY_ID[rid].color);
          colors[i * 3] = tmp.r;
          colors[i * 3 + 1] = tmp.g;
          colors[i * 3 + 2] = tmp.b;

          if (!anchors[rid]) anchors[rid] = { x: 0, y: 0, z: 0, n: 0 };
          // approximate local vertex → later world via mesh matrix (use bind-ish)
          const a = anchors[rid];
          a.x += pos.getX(i); a.y += pos.getY(i); a.z += pos.getZ(i); a.n++;
        }
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        o.material = new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.65,
          metalness: 0.02,
        });
      });

      // Better anchors from bones
      if (skel) {
        for (const b of skel.bones) {
          const rid = regionForBoneName(b.name);
          if (!anchors[rid]) anchors[rid] = { x: 0, y: 0, z: 0, n: 0, fromBone: true };
          if (anchors[rid].fromBone !== false) {
            b.updateWorldMatrix(true, false);
            const p = new THREE.Vector3().setFromMatrixPosition(b.matrixWorld);
            const a = anchors[rid];
            if (!a.fromBone) { a.x = 0; a.y = 0; a.z = 0; a.n = 0; a.fromBone = true; }
            a.x += p.x; a.y += p.y; a.z += p.z; a.n++;
          }
        }
      }

      const present = REGION_DEFS.filter((r) => counts[r.id] > 0);
      showLegend(present.map((r) => ({ id: r.id, label: r.label, color: r.color })));
      drawRegionCallouts(present.map((r) => {
        const a = anchors[r.id];
        if (!a || !a.n) return null;
        return {
          id: r.id,
          label: r.label,
          color: r.color,
          world: new THREE.Vector3(a.x / a.n, a.y / a.n, a.z / a.n),
        };
      }).filter(Boolean));

      return {
        mode: 'region',
        counts,
        legend: present.map((r) => ({ id: r.id, label: r.label, color: r.color, verts: counts[r.id] })),
      };
    }

    function showLegend(entries) {
      legendEl.innerHTML = [
        '<div style="font-weight:700;margin-bottom:6px">Body map</div>',
        ...entries.map((e) =>
          `<div><span class="swatch" style="background:${e.color}"></span>${e.label}</div>`),
      ].join('');
      legendEl.classList.add('visible');
    }

    function clearCallouts() {
      calloutsEl.innerHTML = '';
    }

    function drawRegionCallouts(items) {
      clearCallouts();
      if (!items.length) return;
      const w = innerWidth;
      const h = innerHeight;
      const ndc = new THREE.Vector3();
      // alternate labels left/right by x
      const projected = items.map((it, idx) => {
        ndc.copy(it.world).project(camera);
        const x = (ndc.x * 0.5 + 0.5) * w;
        const y = (-ndc.y * 0.5 + 0.5) * h;
        return { ...it, x, y, idx, behind: ndc.z > 1 };
      }).filter((p) => !p.behind);

      projected.sort((a, b) => a.y - b.y);
      const left = [];
      const right = [];
      projected.forEach((p, i) => (i % 2 === 0 ? left : right).push(p));

      function place(side, list) {
        const margin = 14;
        const labelX = side === 'left' ? margin : w - margin;
        let yCursor = 80;
        return list.map((p) => {
          const ly = Math.max(yCursor, p.y);
          yCursor = ly + 28;
          return {
            ...p,
            lx: labelX,
            ly,
            anchor: side === 'left' ? 'start' : 'end',
          };
        });
      }
      const placed = [...place('left', left), ...place('right', right)];

      const lines = placed.map((p) => {
        const textX = p.anchor === 'start' ? p.lx : p.lx;
        return `
          <line x1="${p.x}" y1="${p.y}" x2="${textX}" y2="${p.ly}" stroke="${p.color}" stroke-width="2" />
          <circle cx="${p.x}" cy="${p.y}" r="4" fill="${p.color}" stroke="#111" stroke-width="1" />
          <text x="${textX}" y="${p.ly}" fill="#111" font-size="13" font-family="Segoe UI, sans-serif"
            font-weight="700" text-anchor="${p.anchor}" dominant-baseline="middle"
            stroke="#fff" stroke-width="3" paint-order="stroke">${p.label}</text>
        `;
      }).join('');

      calloutsEl.innerHTML = `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${lines}</svg>`;
    }

    function listMeshParts() {
      const parts = [];
      glbRoot?.traverse((o) => {
        if (!o.isMesh) return;
        parts.push({
          name: o.name,
          parent: o.parent?.name || null,
          verts: o.geometry?.getAttribute('position')?.count || 0,
          skinned: !!o.isSkinnedMesh,
          visible: o.visible,
          morphs: o.morphTargetDictionary ? Object.keys(o.morphTargetDictionary).length : 0,
        });
      });
      return parts;
    }

    function shapeKeyExists(name) {
      if (!name) return false;
      if (Object.prototype.hasOwnProperty.call(shapeKeyValues, name)) return true;
      for (const mesh of shapeKeyMeshes) {
        if (mesh.morphTargetDictionary
          && Object.prototype.hasOwnProperty.call(mesh.morphTargetDictionary, name)) {
          return true;
        }
      }
      return false;
    }

    function findShapeKeyName(wanted) {
      if (!wanted) return null;
      if (shapeKeyExists(wanted)) return wanted;
      const want = String(wanted).trim().toLowerCase();
      for (const name of Object.keys(shapeKeyValues)) {
        if (name.toLowerCase() === want) return name;
      }
      for (const mesh of shapeKeyMeshes) {
        const dict = mesh.morphTargetDictionary;
        if (!dict) continue;
        for (const name of Object.keys(dict)) {
          if (name.toLowerCase() === want) return name;
        }
      }
      return null;
    }

    function axisConsumedKeys() {
      const set = new Set();
      for (const def of SHAPE_AXIS_DEFS) {
        for (const t of def.positive || []) {
          const k = findShapeKeyName(t.key);
          if (k) set.add(k);
        }
        for (const t of def.negative || []) {
          const k = findShapeKeyName(t.key);
          if (k) set.add(k);
        }
      }
      return set;
    }

    function rangeAbbrev(range) {
      if (!range) return null;
      const r = String(range).toLowerCase();
      if (r === 'b' || r === 'big') return 'B';
      if (r === 's' || r === 'small') return 'S';
      return String(range).toUpperCase().slice(0, 1);
    }

    function buildShapeKeyCatalog() {
      shapeKeyGroups = [];
      shapeKeyValues = {};
      shapeKeyMeshes = [];
      shapeAxisValues = {};
      if (!glbRoot) return { groups: [], keys: 0, axes: 0 };

      // Collect morph names in index order from the richest mesh, then union all.
      const byIndex = new Map(); // name -> min index seen
      glbRoot.traverse((o) => {
        if (!o.isMesh || !o.morphTargetDictionary || !o.morphTargetInfluences) return;
        shapeKeyMeshes.push(o);
        for (const [name, idx] of Object.entries(o.morphTargetDictionary)) {
          const i = +idx;
          if (!byIndex.has(name) || i < byIndex.get(name)) byIndex.set(name, i);
        }
      });
      const ordered = [...byIndex.entries()]
        .sort((a, b) => a[1] - b[1] || a[0].localeCompare(b[0]))
        .map(([n]) => n);

      let current = { id: 'ungrouped', label: 'Ungrouped', keys: [] };
      const pushCurrent = () => {
        if (current.keys.length) shapeKeyGroups.push(current);
      };
      for (const name of ordered) {
        if (isShapeKeyGroupHeader(name)) {
          pushCurrent();
          current = {
            id: `g_${shapeKeyGroups.length}_${normalizeBoneKey(name)}`,
            label: cleanGroupLabel(name),
            header: name,
            keys: [],
          };
          // Headers are not adjustable — leave influence at 0, do not put in shapeKeyValues.
          continue;
        }
        current.keys.push(name);
        shapeKeyValues[name] = 0;
      }
      pushCurrent();
      // Drop empty leading ungrouped if we only had headers then keys.
      shapeKeyGroups = shapeKeyGroups.filter((g) => g.keys.length > 0);

      for (const def of SHAPE_AXIS_DEFS) {
        shapeAxisValues[def.id] = def.defaultValue ?? 0;
      }
      applyAllShapeKeys();
      applyAllShapeAxes();
      return {
        groups: shapeKeyGroups.map((g) => ({ id: g.id, label: g.label, count: g.keys.length })),
        keys: Object.keys(shapeKeyValues).length,
        axes: SHAPE_AXIS_DEFS.length,
        categories: MORPH_CATEGORIES.length,
        meshes: shapeKeyMeshes.length,
      };
    }

    function applyShapeKeyByName(name, value) {
      const resolved = findShapeKeyName(name) || name;
      // Allow signed morphs (e.g. Small Nose_-1 → influence -1)
      const v = Math.max(-1, Math.min(1, +value || 0));
      shapeKeyValues[resolved] = v;
      for (const mesh of shapeKeyMeshes) {
        const dict = mesh.morphTargetDictionary;
        const infl = mesh.morphTargetInfluences;
        if (!dict || !infl) continue;
        if (!Object.prototype.hasOwnProperty.call(dict, resolved)) continue;
        infl[dict[resolved]] = v;
      }
      return true;
    }

    function applyTargetList(targets, weight) {
      // weight is 0..1 slider magnitude; each target gets weight * max (max may be negative)
      for (const t of targets || []) {
        const name = findShapeKeyName(t.key);
        if (!name) continue;
        applyShapeKeyByName(name, weight * (t.max ?? 1));
      }
    }

    function clearTargetList(targets, exceptNames) {
      const except = exceptNames || new Set();
      for (const t of targets || []) {
        const name = findShapeKeyName(t.key);
        if (!name || except.has(name)) continue;
        applyShapeKeyByName(name, 0);
      }
    }

    function findAnimIndexByName(wanted) {
      if (!wanted) return -1;
      const list = animList();
      const want = String(wanted).trim().toLowerCase();
      let idx = list.findIndex((a) => String(a.name || '').toLowerCase() === want);
      if (idx >= 0) return idx;
      idx = list.findIndex((a) => String(a.name || '').toLowerCase().includes(want));
      return idx;
    }

    function playAnimByName(name, { fallbackDefault = false } = {}) {
      let idx = findAnimIndexByName(name);
      if (idx < 0 && fallbackDefault) idx = findAnimIndexByName(DEFAULT_LOOP_ANIM);
      if (idx < 0) idx = 0;
      if (idx < 0 || !animActions[idx]) {
        console.warn('[morph-anim] missing clip:', name);
        return { ok: false, missing: name || null };
      }
      for (const a of animActions) a.enabled = false;
      const action = animActions[idx];
      action.enabled = true;
      action.setLoop(THREE.LoopRepeat, Infinity);
      action.clampWhenFinished = false;
      action.paused = false;
      action.reset();
      action.play();
      animPlaying = true;
      const resolved = animList()[idx]?.name || name;
      return { ok: true, clip: idx, name: resolved };
    }

    function onMorphControlAdjusted(def) {
      if (!def) return;
      if (def.anim) {
        morphAnimPreferred = def.anim;
        const r = playAnimByName(def.anim);
        if (!r.ok) {
          // Clip not in GLB yet — keep current loop, surface warning in HUD via console
          console.warn('[morph-anim] tagged clip not in GLB:', def.anim, '(have:', animList().map((a) => a.name).join(', '), ')');
        }
        return;
      }
      // Leaving a special-tagged control: restore Idle (or move test if toggled on)
      if (morphAnimPreferred) {
        morphAnimPreferred = null;
        playAnimByName(currentLoopAnim(), { fallbackDefault: true });
      }
    }

    function applyShapeAxis(axisId, value, { triggerAnim = true } = {}) {
      const def = SHAPE_AXIS_DEFS.find((d) => d.id === axisId);
      if (!def) return false;
      const pos = def.positive || [];
      const neg = def.negative || [];
      if (def.unipolar) {
        const t = Math.max(0, Math.min(1, +value || 0));
        shapeAxisValues[def.id] = t;
        applyTargetList(pos, t);
      } else {
        const t = Math.max(-1, Math.min(1, +value || 0));
        shapeAxisValues[def.id] = t;
        if (t > 0) {
          const posNames = new Set(pos.map((t0) => findShapeKeyName(t0.key)).filter(Boolean));
          applyTargetList(pos, t);
          clearTargetList(neg, posNames);
        } else if (t < 0) {
          const negNames = new Set(neg.map((t0) => findShapeKeyName(t0.key)).filter(Boolean));
          applyTargetList(neg, Math.abs(t));
          clearTargetList(pos, negNames);
        } else {
          clearTargetList(pos);
          clearTargetList(neg);
        }
      }
      if (triggerAnim) onMorphControlAdjusted(def);
      return true;
    }

    function applyShapeKeyControl(_controlId, _value) {
      return false; // unipolar folded into axes
    }

    function applyAllShapeKeys() {
      for (const [name, v] of Object.entries(shapeKeyValues)) {
        applyShapeKeyByName(name, v);
      }
    }

    function applyAllShapeAxes() {
      for (const def of SHAPE_AXIS_DEFS) {
        applyShapeAxis(def.id, shapeAxisValues[def.id] ?? 0, { triggerAnim: false });
      }
    }

    function applyAllShapeKeyControls() {}

    /** Unified controls for a mesh header group (legacy): bipolar axes + unpaired keys. */
    function listShapeControls(groupId) {
      const g = shapeKeyGroups.find((x) => x.id === groupId) || shapeKeyGroups[0];
      if (!g) return [];
      const groupKeys = new Set(g.keys);
      const consumed = axisConsumedKeys();
      const out = [];

      for (const def of SHAPE_AXIS_DEFS) {
        const posKeys = (def.positive || []).map((t) => findShapeKeyName(t.key)).filter(Boolean);
        const negKeys = (def.negative || []).map((t) => findShapeKeyName(t.key)).filter(Boolean);
        const inGroup = [...posKeys, ...negKeys].some((k) => groupKeys.has(k));
        if (!inGroup) continue;
        out.push({
          type: 'axis',
          id: def.id,
          label: def.label,
          range: rangeAbbrev(def.range) || 'B',
          value: shapeAxisValues[def.id] ?? 0,
          min: def.unipolar ? 0 : -1,
          max: 1,
          anim: def.anim || null,
          negativeLabel: negKeys[0] || '−',
          positiveLabel: posKeys[0] || '+',
          negativeMax: def.negative?.[0]?.max ?? 1,
          positiveMax: def.positive?.[0]?.max ?? 1,
        });
      }

      for (const name of g.keys) {
        if (consumed.has(name)) continue;
        out.push({
          type: 'key',
          id: name,
          label: name,
          range: rangeAbbrev(SHAPE_KEY_RANGE[name]) || null,
          value: shapeKeyValues[name] ?? 0,
          min: 0,
          max: 1,
        });
      }
      return out;
    }

    function listMorphCategories() {
      return MORPH_CATEGORIES.map((cat) => ({
        id: cat.id,
        label: cat.label,
        count: cat.controls.length,
      }));
    }

    function listMorphControls(categoryId) {
      const cat = MORPH_CATEGORIES.find((c) => c.id === categoryId) || MORPH_CATEGORIES[0];
      if (!cat) return [];
      const out = [];
      for (const c of cat.controls) {
        if (c.type === 'bone') {
          const boneVal = c.id === 'height'
            ? bodyHeight
            : c.id === 'headSize'
              ? bodyHeadSize
              : (propValues[c.id] ?? 0);
          out.push({
            type: 'bone',
            id: c.id,
            label: c.label,
            range: rangeAbbrev(c.range) || 'S',
            boneMorph: true,
            value: boneVal,
            min: -1,
            max: 1,
            anim: null,
          });
        } else if (c.type === 'form') {
          const def = FORM_CTRL_DEFS[c.id];
          out.push({
            type: 'form',
            id: c.id,
            label: c.label,
            range: rangeAbbrev(c.range) || 'S',
            boneMorph: true,
            value: formCtrlValues[c.id] ?? 0,
            min: -1,
            max: 1,
            anim: null,
            formBone: def?.bone || null,
            formMode: def?.mode || null,
            formAxis: def?.axis || null,
            formAmp: def?.amp ?? 0,
            positiveLabel: `${def?.mode || '?'}.${def?.axis || '?'} ±${def?.amp ?? 0}`,
            negativeLabel: def?.bone || 'CTRL',
          });
        } else if (c.type === 'axis') {
          const def = SHAPE_AXIS_DEFS.find((d) => d.id === c.id);
          const unipolar = !c.negative || c.negative.length === 0;
          const pos = c.positive || [];
          const neg = c.negative || [];
          out.push({
            type: 'axis',
            id: c.id,
            label: c.label,
            range: rangeAbbrev(c.range) || 'B',
            boneMorph: false,
            value: shapeAxisValues[c.id] ?? 0,
            min: unipolar ? 0 : -1,
            max: 1,
            anim: c.anim || null,
            negativeKey: neg.map((t) => t.key).join('+') || null,
            positiveKey: pos.map((t) => t.key).join('+') || null,
            negativeMax: neg[0]?.max ?? 1,
            positiveMax: pos[0]?.max ?? 1,
            negativeLabel: neg.map((t) => `${t.key}${t.max !== 1 ? '@' + t.max : ''}`).join('+') || '−',
            positiveLabel: pos.map((t) => `${t.key}${t.max !== 1 ? '@' + t.max : ''}`).join('+') || '+',
          });
        }
      }
      return out;
    }

    async function loadGlbFromUrl(url) {
      statusEl.textContent = 'Loading GLB…';
      if (!heightRecipe) await loadHeightRecipe();
      const gltf = await new GLTFLoader().loadAsync(url);
      if (glbRoot) scene.remove(glbRoot);
      disposeMixer();
      matBackup.clear();
      mapMode = null;
      clearCallouts();
      glbRoot = gltf.scene;
      scene.add(glbRoot);
      heightSceneRestY = glbRoot.position.y;
      heightRoot = resolveHeightRoot(glbRoot);
      heightRootBaseline = heightRoot
        ? (heightRoot.scale.x + heightRoot.scale.y + heightRoot.scale.z) / 3
        : 1;
      bodyHeight = 0;
      bodyHeadSize = 0;
      for (const k of Object.keys(propValues)) propValues[k] = 0;
      for (const k of Object.keys(formCtrlValues)) formCtrlValues[k] = 0;
      // Single height pivot before rest capture (see bindChestCtrlToStatureForHeight).
      bindChestCtrlToStatureForHeight(glbRoot);
      // Capture bind/rest BEFORE mixer applies any clip (Height frame0 would pollute rest).
      heightRestScales.clear();
      heightRestTRS.clear();
      if (!heightRecipe) await loadHeightRecipe();
      captureHeightRestScales(true);
      setupAnimations(gltf);
      // If CTRL-* overlay bones exist, drive them all from the H slider (anim-safe parents mode).
      heightParentBones = collectHeightParentBones(glbRoot);
      const formN = captureFormCtrlRests(glbRoot);
      if (heightParentBones.length) {
        heightMode = 'parents';

      ctrlSlider.max = String(c.max ?? 1);
      ctrlSlider.step = '0.01';
      ctrlSlider.value = String(c.value ?? (c.min >= 0 ? 0 : 0));
      refreshValueLabel();
    }

    function fillCategories() {
      const cats = window.sandboxListMorphCategories?.() || [];
      catSelect.innerHTML = '';
      for (const cat of cats) {
        const opt = document.createElement('option');
        opt.value = cat.id;
        opt.textContent = `${cat.label} (${cat.count})`;
        catSelect.appendChild(opt);
      }
      if (cats.length) {
        const preferCat = cats.find((c) => c.id === 'bodyBones') || cats[0];
        catSelect.value = preferCat.id;
        fillControls(preferCat.id);
      }
    }

    function wireMorphUi() {
      morphPanel.classList.add('visible');
      catSelect.addEventListener('change', () => fillControls(catSelect.value));
      ctrlSelect.addEventListener('change', onControlPicked);
      ctrlSlider.addEventListener('input', () => applyUiValue(ctrlSlider.value, { fromSlider: true }));
      btnMin.addEventListener('click', () => {
        const c = selectedControl();
        if (c) applyUiValue(c.min ?? -1);
      });
      btnMid.addEventListener('click', () => {
        const c = selectedControl();
        if (!c) return;
        const min = c.min ?? -1;
        const max = c.max ?? 1;
        applyUiValue((min + max) / 2);
      });
      btnMax.addEventListener('click', () => {
        const c = selectedControl();
        if (c) applyUiValue(c.max ?? 1);
      });
      btnAnim.addEventListener('click', () => {
        uiMoveTest = !uiMoveTest;
        window.sandboxSetMoveTest?.(uiMoveTest);
        btnAnim.textContent = uiMoveTest ? 'Anim: move test' : 'Anim: Idle';
        btnAnim.classList.toggle('active', uiMoveTest);
      });
      btnCam.addEventListener('click', () => {
        uiFaceCam = !uiFaceCam;
        window.sandboxSetCameraFraming?.(uiFaceCam ? 'face' : 'body');
        btnCam.textContent = uiFaceCam ? 'Camera: Face' : 'Camera: Body';
        btnCam.classList.toggle('active', uiFaceCam);
      });
      btnOrbit.addEventListener('click', () => {
        uiOrbit = !uiOrbit;
        window.sandboxSetFixedCamera?.(!uiOrbit);
        btnOrbit.textContent = uiOrbit ? 'Orbit: On' : 'Orbit: Off';
        btnOrbit.classList.toggle('active', uiOrbit);
      });
      fillCategories();
    }

    async function modelAvailable(url) {
      try {
        const res = await fetch(url, { method: 'HEAD', cache: 'no-store' });
        if (res.ok) return true;
        // Some static servers omit HEAD — try a tiny ranged GET
        const get = await fetch(url, { method: 'GET', headers: { Range: 'bytes=0-0' }, cache: 'no-store' });
        return get.ok || get.status === 206;
      } catch {
        return false;
      }
    }

    async function bootStandalone() {
      if (!(await modelAvailable(DEFAULT_MODEL_URL))) {
        statusEl.textContent = 'Waiting for GLB URL from Flutter…';
        return;
      }
      statusEl.textContent = 'Loading model…';
      try {
        await loadGlbFromUrl(DEFAULT_MODEL_URL);
        window.sandboxSetClarity?.(true);
        window.sandboxViewFront?.();
        window.sandboxSetFixedCamera?.(true);
        window.sandboxPlayLoopAnim?.();
        wireMorphUi();
        statusEl.textContent = 'Ready · browser concept viewer';
      } catch (err) {
        console.error(err);
        statusEl.textContent = `Load failed: ${err?.message || err}`;
      }
    }

    bootStandalone();
  </script>
</body>
</html>
