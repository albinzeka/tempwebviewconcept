<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Additional bone CTRL project</title>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js",
      "BufferGeometryUtils": "./vendor/BufferGeometryUtils.js"
    }
  }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #1a1a1a; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
    #c { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute; left: 8px; top: 8px; z-index: 2;
      background: rgba(0,0,0,0.65); color: #e8e8e8; padding: 10px 12px;
      border-radius: 8px; font-size: 12px; line-height: 1.45; max-width: 92vw;
      pointer-events: none;
    }
    #hud b { color: #9fef9f; }
    #hud .fail { color: #ff8a8a; }
    #hud .pass { color: #9fef9f; }
    #status { position: absolute; left: 8px; bottom: 8px; color: #aaa; font-size: 11px; z-index: 2; }
    #callouts {
      position: absolute; inset: 0; z-index: 3; pointer-events: none;
      overflow: hidden;
    }
    #callouts svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    #legend {
      position: absolute; right: 8px; top: 8px; z-index: 4;
      background: rgba(255,255,255,0.92); color: #111; padding: 10px 12px;
      border-radius: 8px; font-size: 12px; line-height: 1.4; max-width: 220px;
      display: none;
    }
    #legend .swatch {
      display: inline-block; width: 12px; height: 12px; border-radius: 2px;
      margin-right: 6px; vertical-align: -1px; border: 1px solid #0003;
    }
    body.clarity #hud, body.clarity #status { display: none; }
    body.clarity #legend.visible { display: block; }
    #morphPanel {
      display: none;
      position: absolute; right: 10px; bottom: 10px; z-index: 6;
      width: min(360px, calc(100vw - 20px));
      max-height: min(52vh, 420px);
      overflow: auto;
      background: rgba(18, 20, 26, 0.94);
      color: #e8e8ee;
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.45);
      pointer-events: auto;
    }
    #morphPanel.visible { display: block; }
    #morphPanel h1 {
      margin: 0 0 8px; font-size: 14px; font-weight: 650; letter-spacing: 0.02em;
    }
    #morphPanel .row { margin-bottom: 8px; }
    #morphPanel label {
      display: block; color: #9aa; font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.04em; margin-bottom: 3px;
    }
    #morphPanel select, #morphPanel button {
      width: 100%; box-sizing: border-box;
      background: #24262f; color: #cfd2da; border: 1px solid #3a3d48;
      border-radius: 6px; padding: 6px 8px; font-size: 12px;
    }
    #morphPanel .btns { display: flex; flex-wrap: wrap; gap: 6px; }
    #morphPanel .btns button { width: auto; flex: 1 1 auto; cursor: pointer; }
    #morphPanel .btns button.active { background: #3d6df0; border-color: #3d6df0; color: #fff; }
    #morphPanel input[type="range"] { width: 100%; }
    #morphPanel .val { color: #cfd2da; font-variant-numeric: tabular-nums; margin-top: 2px; }
    #morphPanel .hint { color: #888; font-size: 11px; margin-top: 2px; }
  </style>
</head>
<body>
  <div id="hud">Loading…</div>
  <div id="legend"></div>
  <div id="callouts"></div>
  <div id="status"></div>
  <div id="morphPanel">
    <h1>Additional bone CTRL</h1>
    <div class="row">
      <label for="catSelect">Category</label>
      <select id="catSelect"></select>
    </div>
    <div class="row">
      <label for="ctrlSelect">Control</label>
      <select id="ctrlSelect"></select>
    </div>
    <div class="row">
      <div class="val" id="ctrlValue">—</div>
      <div class="hint" id="ctrlHint"></div>
      <input id="ctrlSlider" type="range" min="-1" max="1" step="0.01" value="0" disabled />
    </div>
    <div class="row btns">
      <button type="button" id="btnMin">Min</button>
      <button type="button" id="btnMid">Mid</button>
      <button type="button" id="btnMax">Max</button>
    </div>
    <div class="row btns">
      <button type="button" id="btnAnim">Anim: Idle</button>
      <button type="button" id="btnCam">Camera: Body</button>
      <button type="button" id="btnOrbit">Orbit: Off</button>
    </div>
  </div>
  <canvas id="c"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from './vendor/GLTFLoader.js';
    import { OrbitControls } from './vendor/OrbitControls.js';

    const canvas = document.getElementById('c');
    const hudEl = document.getElementById('hud');
    const statusEl = document.getElementById('status');

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2a2a2a);

    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 100);
    // Full-body framing for ~1.6–1.8m standing character (was too low → legs-only shots).
    camera.position.set(0, 1.05, 4.6);
    camera.lookAt(0, 0.85, 0);

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 0.85, 0);
    controls.enabled = false;
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const key = new THREE.DirectionalLight(0xffffff, 1.1);
    key.position.set(2.5, 4, 3);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xffffff, 0.35);
    fill.position.set(-2.5, 2, -1);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffffff, 0.45);
    rim.position.set(0, 2.5, -3);
    scene.add(rim);

    const gridFloor = new THREE.GridHelper(4, 40, 0x666666, 0x3a3a3a);
    scene.add(gridFloor);

    function makeChecker(size = 512, cells = 16, a = '#4a4a4a', b = '#2e2e2e') {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      const cs = size / cells;
      for (let y = 0; y < cells; y++) {
        for (let x = 0; x < cells; x++) {
          g.fillStyle = (x + y) % 2 === 0 ? a : b;
          g.fillRect(x * cs, y * cs, cs, cs);
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 1.5);
      return tex;
    }
    const wall = new THREE.Mesh(
      new THREE.PlaneGeometry(4, 3),
      new THREE.MeshBasicMaterial({ map: makeChecker() }),
    );
    wall.position.set(0, 1.5, -1.2);
    scene.add(wall);

    const rulerGroup = new THREE.Group();
    scene.add(rulerGroup);
    function rebuildRulers(maxY = 2.0, step = 0.1) {
      while (rulerGroup.children.length) {
        const o = rulerGroup.children[0];
        rulerGroup.remove(o);
        o.geometry?.dispose?.();
        o.material?.dispose?.();
      }
      for (let y = 0; y <= maxY + 1e-6; y = +(y + step).toFixed(4)) {
        const pts = [new THREE.Vector3(-1.6, y, -1.19), new THREE.Vector3(1.6, y, -1.19)];
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        const major = Math.abs(y % 0.5) < 1e-6;
        rulerGroup.add(new THREE.Line(geo, new THREE.LineBasicMaterial({
          color: major ? 0x88ff88 : 0x558855,
          transparent: true,
          opacity: major ? 0.9 : 0.45,
        })));
      }
    }
    rebuildRulers(2.0, 0.1);

    let glbRoot = null;
    let heightRoot = null;
    let heightRootBaseline = 1;
    let bodyHeight = 0;
    let bodyHeadSize = 0; // -1..1 independent head scale on CTRL-ORG-spine.005
    // Extra proportion sliders (-1..1). Applied as local axis scales on CTRL bones.
    const propValues = {
      shoulderWidth: 0,
      upperTorsoThickness: 0,
      bellyThickness: 0,
      upperTorsoWidth: 0,
      armSize: 0,
      legsThickness: 0,
      hipBone: 0,
    };
    // small → ×0.9..1.1  |  big → ×0.8..1.2
    const PROP_DEFS = {
      shoulderWidth: {
        id: 'shoulderWidth',
        label: 'Shoulder width',
        range: 'small',
        targets: [{ bone: 'CTRL-tweak_spine.003', axes: 'x' }],
      },
      upperTorsoThickness: {
        id: 'upperTorsoThickness',
        label: 'Upper torso thickness',
        range: 'small',
        targets: [
          { bone: 'CTRL-tweak_spine.003', axes: 'z' },
          { bone: 'CTRL-tweak_spine.002', axes: 'z' },
        ],
      },
      bellyThickness: {
        id: 'bellyThickness',
        label: 'Belly thickness',
        range: 'small',
        targets: [{ bone: 'CTRL-tweak_spine.001', axes: 'z' }],
      },
      upperTorsoWidth: {
        id: 'upperTorsoWidth',
        label: 'Upper torso width',
        range: 'small',
        targets: [{ bone: 'CTRL-DEF-spine.003', axes: 'x' }],
      },
      armSize: {
        id: 'armSize',
        label: 'Arm size',
        range: 'big',
        targets: [
          { bone: 'CTRL-DEF-upper_arm.L', axes: 'xz' },
          { bone: 'CTRL-DEF-upper_arm.R', axes: 'xz' },
        ],
      },
      legsThickness: {
        id: 'legsThickness',
        label: 'Legs thickness',
        range: 'small',
        targets: [
          { bone: 'CTRL-DEF-thigh.L', axes: 'x' },
          { bone: 'CTRL-DEF-thigh.R', axes: 'x' },
        ],
      },
      hipBone: {
        id: 'hipBone',
        label: 'Hip bone',
        range: 'small',
        targets: [{ bone: 'CTRL-tweak_spine', axes: 'x' }],
      },
    };

    /**
     * Optional form overlay CTRLs — local TRS deltas after mixer / height.
     * Values −1..1 → ±amp. Empty until a trial bone is added.
     */
    const FORM_CTRL_DEFS = {};
    const formCtrlValues = Object.fromEntries(
      Object.keys(FORM_CTRL_DEFS).map((id) => [id, 0]),
    );
    /** boneKey -> { pos:{x,y,z}, scl:{x,y,z} } captured at bind */
    const formCtrlRest = new Map();
    /** boneKey -> resolved Object3D */
    const formCtrlObjects = new Map();

    // Shape-key (morph target) catalog: group headers + synced influences by name across meshes.
    let shapeKeyGroups = []; // [{ id, label, keys: string[] }] — mesh header groups (legacy/debug)
    let shapeKeyValues = {}; // name -> -1..1
    let shapeKeyMeshes = []; // meshes that have morphs
    let shapeAxisValues = {}; // axisId -> -1..1 (or 0..1 for unipolar)
    let morphAnimPreferred = null; // last special anim requested by a tagged control
    const DEFAULT_LOOP_ANIM = 'Idle';
    let moveTestEnabled = false;

    function currentLoopAnim() {
      return moveTestEnabled ? 'move test' : DEFAULT_LOOP_ANIM;
    }

    /** Parse "Wide Head_0.5" / "Small Nose_-1" → { key, max }. Bare name → max 1. */
    function parseShapeRef(raw) {
      const s = String(raw || '').trim().replace(/^\(+|,+$/g, '').replace(/\)+$/g, '');
      const m = s.match(/^(.*?)(?:_(-?\d+(?:\.\d+)?))$/);
      if (m) {
        return { key: m[1].trim(), max: Math.max(-1, Math.min(1, +m[2])) };
      }
      return { key: s, max: 1 };
    }

    /** "A_0.4)+(B_0.4" or "A)+(B" or "A_0.5" → target list */
    function parseTargetList(raw) {
      return String(raw || '')
        .split('+')
        .map((p) => parseShapeRef(p.trim().replace(/^\(/, '').replace(/\)$/, '')))
        .filter((t) => t.key);
    }

    function slugControlId(label) {
      return String(label || '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '_')
        .replace(/^_|_$/g, '') || 'ctrl';
    }

    function axisCtrl(label, range, posRaw, negRaw, anim, defaultValue, explicitId) {
      const positive = parseTargetList(posRaw);
      const negative = negRaw != null && String(negRaw).trim() !== ''
        ? parseTargetList(negRaw)
        : null;
      return {
        type: 'axis',
        id: explicitId || slugControlId(label),
        label,
        range,
        positive,
        negative,
        anim: anim || null,
        defaultValue: defaultValue != null ? +defaultValue : 0,
      };
    }

    /**
     * Dev morph catalog.
     * Spec:
     *   [Name]1=(KeyA_0.5)-1=(KeyB_0.2)
     *   [Name]1=(KeyA)+(KeyB){Anim Name}
     *   [Name]1=(Key)                      → unipolar 0..1
     *   Key_0.5 caps at 0.5; Key_-1 allows negative morph influence
     */
    const MORPH_CATEGORIES = [
      {
        id: 'headShapes',
        label: 'Head shapes',
        controls: [
          // 0 = feminine, 1 = masculine; mid start (single morph on base)
          axisCtrl('Gender expression', 'B', 'Face gender expression', null, null, 0.5, 'face_gender_expression'),
          axisCtrl('Face width', 'B', 'Wide Head_0.5', 'Skinny Head_0.2'),
          axisCtrl('Face height', 'B', 'Tall Head_0.4', 'Short Head_0.4'),
          axisCtrl('Face fullness', 'B', 'Large Face_0.5', 'Skinny Face_0.5'),
          axisCtrl('Neck size', 'S', 'Large Neck_0.5', 'Skinny Neck_0.5'),
          axisCtrl('Head cranium size', 'B', 'Big Cranium', 'Small Cranium_0.4'),
          axisCtrl('Head vertical tilt', 'S', 'Lower Jaw Protrusion_0.2', 'Forehead Protrusion_0.2'),
          axisCtrl('Head shape morph', 'S', 'Taper Bottom Wide_0.4', 'Taper Top Wide_0.4'),
          axisCtrl('Temporal bone width', 'S', 'Head Side Width Out_0.5', null),
          axisCtrl('Lower face length', 'S', 'Lower Face Long_0.3', 'Lower Face Short_0.3'),
          { type: 'bone', id: 'headSize', label: 'Head size', range: 'B' },
        ],
      },
      {
        id: 'bodyBones',
        label: 'Body bones',
        controls: [
          { type: 'bone', id: 'height', label: 'Height', range: 'B' },
          { type: 'bone', id: 'shoulderWidth', label: 'Shoulder width', range: 'S' },
          { type: 'bone', id: 'upperTorsoThickness', label: 'Upper torso thickness', range: 'S' },
          { type: 'bone', id: 'upperTorsoWidth', label: 'Upper torso width', range: 'S' },
          { type: 'bone', id: 'bellyThickness', label: 'Belly thickness', range: 'S' },
          { type: 'bone', id: 'armSize', label: 'Arm size', range: 'B' },
          { type: 'bone', id: 'legsThickness', label: 'Leg thickness', range: 'S' },
          { type: 'bone', id: 'hipBone', label: 'Hip bone size', range: 'S' },
        ],
      },
      {
        id: 'bodyShapes',
        label: 'Body shapes',
        controls: [
          // 0 = feminine, 1 = masculine; mid start (single morph on base)
          axisCtrl('Gender expression', 'B', 'Body gender expression', null, null, 0.5, 'body_gender_expression'),
          axisCtrl('Torso size', 'B', 'Large Torso_0.3', 'Skinny Torso'),
          axisCtrl('Breast size', 'B', 'Large Breasts_0.4', 'Skinny Breasts'),
          axisCtrl('Butt size', 'B', 'Large Butt', 'Skinny Butt_0.5'),
          axisCtrl('Muscular morph', 'B', 'Muscles', 'Simplify Body'),
        ],
      },
      {
        id: 'eyes',
        label: 'Eyes',
        controls: [
          axisCtrl('Eyes vertical position', 'S', 'Upper Face Up_0.3', 'Upper Face Down_0.3'),
          axisCtrl('Eye size', 'B', 'Big Eyes_0.5', 'Small Eyes_0.3'),
          axisCtrl('Eye horizontal', 'S', 'Eyes apart_0.4', 'Eyes closer_0.4'),
          axisCtrl('Eye vertical', 'S', 'Eyes Down_0.4', 'Eyes Up_0.4'),
          axisCtrl('Eye inner vertical', 'S', 'Eye inner up', 'Eye inner down'),
          axisCtrl('Eye outer vertical', 'S', 'Eye outer up', 'Eye outer down'),
          axisCtrl('Eye middle upper vertical', 'S', 'Eye middle upper up', 'Eye middle upper down'),
          axisCtrl('Eye middle lower vertical', 'S', 'Eye middle lower up', 'Eye middle lower down'),
          axisCtrl('Eye depth', 'S', 'Eyes out', 'Eyes in_0.3'),
          axisCtrl('Eye rotation', 'S', 'Eye Clockwise_0.5', 'Eye Counterclockwise_0.5'),
          axisCtrl('Eye squint', 'S', 'Angular Eyes', null),
          axisCtrl('Eye monolid', 'S', 'Monolid', null),
        ],
      },
      {
        id: 'brows',
        label: 'Brows',
        controls: [
          axisCtrl('Brow depth', 'S', 'Brow Forward', 'Brow Back_0.5'),

          axisCtrl('Brow horizontal', 'S', 'Brow Up_0.5', 'Brow Down_0.5'),
          axisCtrl('Inner brow horizontal', 'S', 'Inner Brow Up_0.8', 'Inner Brow Down'),
        ],
      },
      {
        id: 'jaw',
        label: 'Jaw',
        controls: [
          axisCtrl('Jaw size', 'B', 'Square Jaw', 'Thin Jaw'),
          axisCtrl('Jaw position', 'S', 'Jaw Up', 'Jaw Down'),
          axisCtrl('Jaw Forward', 'S', 'Jaw Forward', null),
          axisCtrl('Jaw width', 'S', 'Jowls Large', 'Jowls Small_0.3'),
          axisCtrl('Chin FW/BW', 'S', 'Chin Forward', 'Chin Back'),
          axisCtrl('Chin shape', 'S', 'Square Chin', 'Narrow Chin'),
          axisCtrl('Chin length', 'S', 'Long Chin', 'Short Chin'),
          axisCtrl('Cleft chin', 'S', 'Butt Chin', null),
          axisCtrl('Cheek fullness', 'S', 'Full Cheeks_0.3', 'Sunken Cheeks_0.5'),
          axisCtrl('Cheekbones position', 'S', 'Cheekbones Up_0.5', 'Cheekbones Down_0.5'),
          axisCtrl('Cheekbones size', 'S', 'Pronounced Cheekbones_0.7', 'Flat Cheekbones_0.7'),
        ],
      },
      {
        id: 'mouth',
        label: 'Mouth',
        controls: [
          axisCtrl('Mouth width', 'S', 'Wide Mouth_0.7', 'Narrow Mouth_0.7'),
          axisCtrl('Mouth position', 'S', 'Mouth Down_0.6', 'Mouth Up_0.6'),
          axisCtrl('Mouth corner shape', 'S', 'Mouth Corners Up', 'Mouth Corners Down_0.4'),
          axisCtrl('Upper lip size', 'S', 'Full Top Lip_0.4', 'Thin Top Lip_0.4'),
          axisCtrl('Bottom lip size', 'S', 'Full Bottom Lip_0.2', 'Thin Bottom Lip_0.7'),
          axisCtrl('Lip Bulge', 'S', 'Top Lip Out_0.4)+(Bottom Lip Out_0.4', null),
          axisCtrl('Cupids Bow shape', 'S', 'Remove Cupids Bow', null),
        ],
      },
      {
        id: 'nose',
        label: 'Nose',
        controls: [
          // Same key both sides with signed max (Blender-style negative influence)
          axisCtrl('Nose width', 'B', 'Small Nose_1', 'Small Nose_-1'),
          axisCtrl('Nose scale', 'B', 'Large Nose_0.5', 'Large Nose_-0.5'),
          axisCtrl('Nose vertical', 'S', 'Long Nose_0.5', 'Short Nose_0.5'),
          axisCtrl('Nose tilt', 'S', 'Upturned Nose_0.5', 'Downturned Nose_0.5'),
          axisCtrl('Nose Bridge', 'S', 'Bridge Out', 'Bridge In'),
          axisCtrl('Nose tip shape', 'S', 'Button Nose_0.8', 'Pointy Nose_0.8'),
          axisCtrl('Nose tip length', 'S', 'Pinocchio_0.6', null),
          axisCtrl('Nose depth', 'S', 'Nose Out_0.2', 'Nose In_0.2'),
          axisCtrl('Flatten nose', 'S', 'Flatten Nose_0.5', null),
          axisCtrl('Nostrils', 'S', 'Big Nostrils_0.7', 'Small Nostrils_0.7'),
        ],
      },
      {
        id: 'ears',
        label: 'Ears',
        controls: [
          axisCtrl('Ear size', 'B', 'Big Ears', 'Small Ears_0.5'),
          axisCtrl('Ear vertical', 'S', 'Ears Up_0.4', 'Ears Down_0.4'),
          axisCtrl('Ear forward', 'S', 'Ears Forward_0.6', null),
          axisCtrl('Ear out', 'S', 'Ears Protruding)+(Ears Side Tilt', null),
          axisCtrl('Pointy ear', 'S', 'Pointy Ears_0.5', null),
          axisCtrl('Round ear', 'S', 'Round Ears', null),
        ],
      },
      {
        id: 'specials',
        label: 'Specials',
        controls: [
          axisCtrl('Fangs', 'S', 'Vampire Teeth)+(Lower Fangs', null, 'Smile Open Mouth'),
          axisCtrl('Split tongue', 'S', 'Forked Tongue', null, 'Tongue out'),
        ],
      },
    ];

    // Flat axis defs derived from categories (for apply / consumed-key tracking).
    const SHAPE_AXIS_DEFS = MORPH_CATEGORIES.flatMap((cat) =>
      cat.controls
        .filter((c) => c.type === 'axis')
        .map((c) => ({
          id: c.id,
          label: c.label,
          range: c.range,
          categoryId: cat.id,
          anim: c.anim || null,
          defaultValue: c.defaultValue ?? 0,
          positive: (c.positive || []).map((t) => ({
            key: t.key,
            max: t.max ?? 1,
          })),
          negative: c.negative
            ? c.negative.map((t) => ({ key: t.key, max: t.max ?? 1 }))
            : null,
          unipolar: !c.negative || c.negative.length === 0,
        })),
    );

    const SHAPE_KEY_CONTROLS = []; // unipolar folded into SHAPE_AXIS_DEFS
    const SHAPE_KEY_RANGE = {};
    const isShapeKeyGroupHeader = (name) => {
      const n = String(name || '').trim();
      if (!n) return true;
      if (/^-{2,}.+-{2,}$/.test(n)) return true;
      if (/^={2,}.+={2,}$/.test(n)) return true;
      if (/^_{2,}.+_{2,}$/.test(n)) return true;
      if (/^\[.+\]$/.test(n)) return true;
      // Empty / spacer keys often used as group labels
      if (/^(group|section|category)\b/i.test(n)) return true;
      return false;
    };
    const cleanGroupLabel = (name) => String(name || '')
      .replace(/^[-_=\s\[]+/, '')
      .replace(/[-_=\s\]]+$/, '')
      .trim() || String(name || 'Group');
    let baselineMetrics = null;
    let lastMetrics = null;
    let showBbox = true;
    let bboxHelper = null;
    let clarityOn = false;
    let mapMode = null; // null | 'mesh' | 'region'
    let cameraFraming = 'body'; // 'body' | 'face'
    let heightApplyEnabled = true;
    let heightMode = 'compose'; // 'compose' | 'recipe' | 'mul' | 'overlay' | 'parents' | 'root' | 'off'
    /*__HEIGHT_RECIPE_EMBED_START__*/
    const EMBEDDED_HEIGHT_RECIPE = {
  "version": 4,
  "note": "Procedural TRS recipe from Height anim — do NOT play clip at runtime",
  "bones": [
    {
      "bone": "DEF-footL",
      "channels": {
        "scl": true,
        "pos": false,
        "quat": true
      },
      "short": {
        "scl": {
          "x": 1.243879,
          "y": 1.524165,
          "z": 1.930156
        },
        "pos": {
          "x": 0,
          "y": 0.224071,
          "z": 0
        },
        "quat": {
          "x": -0.562246,
          "y": -0.020574,
          "z": 0.011162,
          "w": 0.826639
